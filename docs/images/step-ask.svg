<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Ask a Bumblebee for more time"><title>Ask a Bumblebee for more time</title><style>
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.drift{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1500px)}}
.glow{transform-box:fill-box;transform-origin:center;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35;transform:scale(.92)}to{opacity:.7;transform:scale(1.08)}}
.twinkle{animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.fall{animation:fall 11s linear infinite}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0)}100%{transform:translate(-160px,460px) rotate(540deg)}}
.flight{animation:flight 16s linear infinite}
@keyframes flight{0%{transform:translate(-90px,250px)}20%{transform:translate(240px,170px)}40%{transform:translate(520px,235px)}
60%{transform:translate(800px,150px)}80%{transform:translate(1080px,215px)}100%{transform:translate(1380px,160px)}}
.bob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:wing .12s linear infinite alternate}
@keyframes wing{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.float{animation:float 7s ease-in-out infinite alternate}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(26px,-22px)}}
.rise{animation:rise 3s ease-out infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-46px) scale(1.15)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(.85)}50%{transform:scale(1.12)}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite}
@keyframes grow{0%{transform:scaleY(.15)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
.bloom{transform-box:fill-box;transform-origin:center;animation:bloom 4s ease-in-out infinite}
@keyframes bloom{0%,20%{transform:scale(0)}50%,85%{transform:scale(1)}100%{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise{opacity:1}}
</style><defs><clipPath id="tile"><circle cx="110" cy="110" r="104"/></clipPath></defs><circle cx="110" cy="110" r="104" fill="#FBF3E6"/><g clip-path="url(#tile)"><path d="M0,170 C60,150 160,150 220,170 V220 H0Z" fill="#9CC08E"/><g class="sway" style="animation-delay:-1.0s"><path d="M80,176 C72.2,150 87.8,137.0 80,118.8" stroke="#5B7F55" stroke-width="3.6" fill="none" stroke-linecap="round"/><ellipse cx="89.88" cy="152.6" rx="8.84" ry="3.6400000000000006" fill="#5B7F55" transform="rotate(-30 89.88 152.6)"/><ellipse cx="90.9" cy="118.8" rx="9.4" ry="5.7" fill="#E9B949" transform="rotate(0 90.9 118.8)"/><ellipse cx="85.5" cy="128.3" rx="9.4" ry="5.7" fill="#E9B949" transform="rotate(60 85.5 128.3)"/><ellipse cx="74.5" cy="128.3" rx="9.4" ry="5.7" fill="#E9B949" transform="rotate(120 74.5 128.3)"/><ellipse cx="69.1" cy="118.8" rx="9.4" ry="5.7" fill="#E9B949" transform="rotate(180 69.1 118.8)"/><ellipse cx="74.5" cy="109.3" rx="9.4" ry="5.7" fill="#E9B949" transform="rotate(240 74.5 109.3)"/><ellipse cx="85.5" cy="109.3" rx="9.4" ry="5.7" fill="#E9B949" transform="rotate(300 85.5 109.3)"/><circle cx="80" cy="118.8" r="6.2" fill="#F6E3A1"/></g><g transform="translate(138 92)"><g class="bob"><g transform="scale(1.3)"><ellipse class="wing" cx="-4" cy="-13" rx="8" ry="11" fill="#FFFFFF" fill-opacity=".75" stroke="#C9D7E0"/><ellipse class="wing" cx="7" cy="-12" rx="7" ry="10" fill="#FFFFFF" fill-opacity=".75" stroke="#C9D7E0" style="animation-delay:-.06s"/><ellipse cx="0" cy="0" rx="17" ry="12" fill="#F2C14E"/><path d="M-6,-11 v22 M4,-11 v22" stroke="#3E3A32" stroke-width="4"/><circle cx="13" cy="-2" r="2.2" fill="#3E3A32"/><path d="M-17,0 l-6,2" stroke="#3E3A32" stroke-width="2.5" stroke-linecap="round"/></g></g></g><path class="pop" d="M120,48 c0,-10 14,-12 16,-2 c2,-10 16,-8 16,2 c0,10 -16,18 -16,22 c0,-4 -16,-12 -16,-22z" fill="#E8A0A6"/></g><circle cx="110" cy="110" r="104" fill="none" stroke="#E6DCC8" stroke-width="3"/></svg>
