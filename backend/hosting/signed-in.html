<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Almost there · Meadow</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <div class="flower" aria-hidden="true">💌</div>
    <h1>Almost there</h1>
    <a id="open" class="button" href="#" hidden>Open in Meadow</a>
    <p id="broken" hidden>This link doesn't look right. Ask Meadow for a new one.</p>
  </main>
  <script>
    // The browser opened the sign-in link instead of Meadow: hand the whole link back to the app.
    const query = new URLSearchParams(location.search);
    const isSignIn = query.get("mode") === "signIn" && !!query.get("oobCode");
    const open = document.getElementById("open");
    if (isSignIn) {
      open.href = "meadow://signin?link=" + encodeURIComponent(location.href);
      open.hidden = false;
    } else {
      document.getElementById("broken").hidden = false;
    }
  </script>
</body>
</html>
