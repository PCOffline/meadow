name: Release

# Push a tag like v1.2.0 to publish a signed APK as a GitHub release.
# The app's updater reads these releases, so every release must be signed with the same key.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag is a version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Add the GOOGLE_SERVICES_JSON secret before releasing"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - name: Add signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEADOW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the MEADOW_KEYSTORE_BASE64, MEADOW_KEYSTORE_PASSWORD, MEADOW_KEY_ALIAS and MEADOW_KEY_PASSWORD secrets before releasing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MEADOW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          MEADOW_KEYSTORE_PASSWORD: ${{ secrets.MEADOW_KEYSTORE_PASSWORD }}
          MEADOW_KEY_ALIAS: ${{ secrets.MEADOW_KEY_ALIAS }}
          MEADOW_KEY_PASSWORD: ${{ secrets.MEADOW_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease -Pmeadow.version="$VERSION" --stacktrace
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "meadow-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" "meadow-$VERSION.apk" --title "Meadow $VERSION" --generate-notes --verify-tag
          rm -f "$RUNNER_TEMP/release.jks"
