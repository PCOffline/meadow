name: Build

# Pull requests are tested as they would merge; pushes only for main, so a branch with an open
# pull request isn't built twice. Run it by hand for a branch without one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes its older run pointless. Other runs, such as every
# push to main, get a group of their own, so none is cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Each job asks for only what it needs; Build's jobs only read the repository.
permissions: {}

jobs:
  # Which parts the change touches, so a change to the docs alone doesn't build the app. A push
  # to main, or a run by hand, builds everything. If this job fails, the jobs below run anyway.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base: their difference is the change.
          fetch-depth: 2
          persist-credentials: false
      - name: Find what changed
        id: paths
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          # The app is built from app/, the legal documents, detekt's config and Gradle's files.
          app='^(app/|legal/|config/|gradle/|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|\.github/workflows/build\.yml|\.github/scripts/(detekt\.sh|coverage_floor\.py|failed_tests\.py))'
          # The backend tests cover backend/ and the hosted legal pages.
          backend='^(backend/|legal/|\.github/workflows/build\.yml|\.github/scripts/failed_tests\.py)'
          if grep -qE "$app" <<< "$files"; then echo "app=true"; else echo "app=false"; fi >> "$GITHUB_OUTPUT"
          if grep -qE "$backend" <<< "$files"; then echo "backend=true"; else echo "backend=false"; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # The app's build and its unit tests each take minutes, so they run side by side.
  android-build:
    name: android (build and lint)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Building with Firebase config"
          else
            echo "No GOOGLE_SERVICES_JSON secret; building without a backend"
          fi
      - name: Static analysis (detekt, likely bugs only)
        run: .github/scripts/detekt.sh
      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease lintDebug --stacktrace
      - name: Lint findings
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || echo "No lint report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meadow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  android-tests:
    name: android (unit tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit test with coverage
        run: ./gradlew createDebugUnitTestCoverageReport --stacktrace
      - name: Unit test coverage floor
        # Just under what the tests reach today (47.6% of lines, 32.8% of branches): it can only
        # go up. Raise it as coverage grows.
        run: |
          report=$(find app/build/reports/coverage -name report.xml | head -n 1)
          python3 .github/scripts/coverage_floor.py "$report" --lines 45 --branches 30
      - name: Show failed unit tests
        if: failure()
        run: python3 .github/scripts/failed_tests.py app/build/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/coverage/
          if-no-files-found: ignore

  # One check named android, as before, that passes only when the build and the tests did.
  android:
    if: ${{ !cancelled() }}
    needs: [android-build, android-tests]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      # Skipped means the change doesn't touch the app.
      - name: The build and the tests passed
        env:
          BUILD: ${{ needs.android-build.result }}
          TESTS: ${{ needs.android-tests.result }}
        run: |
          echo "Build: $BUILD. Tests: $TESTS."
          [[ "$BUILD" =~ ^(success|skipped)$ && "$TESTS" =~ ^(success|skipped)$ ]]

  # Workflows and scripts: mistakes here only show up when a release or deploy runs.
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows (actionlint, with shellcheck on their scripts)
        run: pipx run actionlint-py==1.7.12.25 -color
      - name: Check workflow security (zizmor)
        run: pipx run zizmor==1.30.1 --offline --min-severity low .github/workflows
      - name: Check shell scripts (shellcheck)
        run: find . -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 -r shellcheck
      - name: Check the Python scripts (ruff)
        run: pipx run ruff==0.17.0 check .github/scripts docs/art
      - name: Check the CI Python scripts
        run: |
          python3 -m py_compile .github/scripts/*.py
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

  functions:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - name: Lint with type information (oxlint)
        run: npm run lint
      - name: Build and unit test
        run: npm test

  rules:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint the functions, deploy scripts and tests (Biome)
        run: npm run lint
      - name: Security rules tests (Firestore and Storage emulators)
        run: npm run test:rules
      - name: Hosted legal pages
        run: npm run test:hosting
      - name: Deploy scripts (the Storage lifecycle rule)
        run: npm run test:deploy

  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/functions/package-lock.json
      - run: npm ci && npm --prefix functions ci
      - name: Cloud Functions integration tests (Auth, Firestore, Functions, Storage emulators)
        # Also reports which backend code the tests ran (c8, from the emulator's own processes).
        run: npm run test:integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  # The journeys take most of the build's time, so they run in shards, side by side. Each shard
  # has its own phone and backend emulators, and AndroidJUnitRunner gives it a share of the tests.
  e2e-shard:
    name: e2e (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.app != 'false' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/functions/package-lock.json
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the Firebase emulators
        working-directory: backend
        run: |
          npm ci && npm --prefix functions ci && npm --prefix functions run build
          nohup npx firebase emulators:start --only auth,firestore,functions,storage --project demo-meadow > emulators.log 2>&1 &
          region=$(sed -n 's/^MEADOW_REGION=//p' functions/.env)
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{}}' \
              "http://127.0.0.1:5001/demo-meadow/$region/createProfile" || true)
            if [ "$code" != "000" ] && [ "$code" != "404" ]; then echo "Emulators ready ($code)"; exit 0; fi
            sleep 2
          done
          cat emulators.log
          exit 1
      - name: Build the test app
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pmeadow.emulatorHost=10.0.2.2 --stacktrace
      - name: Restore the system image
        # The emulator's Android 14 image, so a run doesn't download it again. Runs on main save it.
        id: avd
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: system-image-34-google_apis-x86_64-v1
      # When a journey fails, the log shows which journeys ran before it on this phone, in order,
      # and which activities started, so one that leaves the phone changed can be found.
      - name: End-to-end tests (Android emulator against Firebase emulators)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A phone's screen, not the default AVD's low density: text contrast is measured from
          # pixels, and at mdpi thin strokes are all anti-aliased edge (real phones are ~420dpi).
          profile: pixel_6
          disable-animations: true
          # The launcher can stop answering on a busy emulator. Its "not responding" dialog takes
          # focus from the journey on screen, as in Pictures and Screenshots, so it stays hidden.
          script: |
            adb shell settings put global hide_error_dialogs 1
            ./gradlew connectedDebugAndroidTest -Pmeadow.emulatorHost=10.0.2.2 -Pandroid.testInstrumentationRunnerArguments.numShards="$SHARDS" -Pandroid.testInstrumentationRunnerArguments.shardIndex="$SHARD" --stacktrace || (adb pull /data/local/tmp/meadow-contrast app/build/reports/androidTests/ || true; adb logcat -d -v time TestRunner:I ActivityTaskManager:I '*:S' | grep -E 'started:|finished:|failed:|START u0|Displayed' | tail -n 150; adb logcat -d -v time Meadow:V MeadowSync:V MeadowBackend:V MeadowFirestore:V MeadowSocial:V MeadowListener:V MeadowGuardian:V FirebaseAuth:V FirebaseFunctions:V Firestore:W System.err:W AndroidRuntime:E ActivityManager:E '*:S' | tail -n 200; exit 1)
      - name: Save the system image
        if: steps.avd.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && matrix.shard == 0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: system-image-34-google_apis-x86_64-v1
      - name: Show end-to-end results
        if: failure()
        run: |
          tail -n 80 backend/emulators.log || true
          python3 .github/scripts/failed_tests.py app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/
            backend/emulators.log
          if-no-files-found: ignore

  # One check named e2e, as before, that passes only when every shard did.
  e2e:
    if: ${{ !cancelled() }}
    needs: e2e-shard
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      # Skipped means the change touches neither the app nor the backend.
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          echo "The shards: $RESULT"
          [[ "$RESULT" =~ ^(success|skipped)$ ]]
