name: Build

# Pull requests are tested as they would merge; pushes only for main, so a branch with an open
# pull request isn't built twice. Run it by hand for a branch without one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes its older run pointless. Other runs, such as every
# push to main, get a group of their own, so none is cancelled.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Each job asks for only what it needs; Build's jobs only read the repository.
permissions: {}

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Add Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Building with Firebase config"
          else
            echo "No GOOGLE_SERVICES_JSON secret; building without a backend"
          fi
      - name: Build, unit test and lint
        run: ./gradlew assembleDebug assembleRelease createDebugUnitTestCoverageReport lintDebug --stacktrace
      - name: Unit test coverage floor
        # Just under what the tests reach today (47.6% of lines, 32.8% of branches): it can only
        # go up. Raise it as coverage grows.
        run: |
          report=$(find app/build/reports/coverage -name report.xml | head -n 1)
          python3 .github/scripts/coverage_floor.py "$report" --lines 45 --branches 30
      - name: Show failed unit tests
        if: failure()
        run: python3 .github/scripts/failed_tests.py app/build/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meadow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
            app/build/reports/coverage/
          if-no-files-found: ignore

  # Workflows and scripts: mistakes here only show up when a release or deploy runs.
  scripts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflows (actionlint, with shellcheck on their scripts)
        run: pipx run actionlint-py==1.7.12.25 -color
      - name: Check workflow security (zizmor)
        run: pipx run zizmor==1.30.1 --offline --min-severity low .github/workflows
      - name: Check shell scripts (shellcheck)
        run: find . -name '*.sh' -not -path '*/node_modules/*' -print0 | xargs -0 -r shellcheck
      - name: Check the CI Python scripts
        run: |
          python3 -m py_compile .github/scripts/*.py
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v

  functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - name: Build and unit test
        run: npm test

  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Security rules tests (Firestore and Storage emulators)
        run: npm run test:rules
      - name: Hosted legal pages
        run: npm run test:hosting
      - name: Deploy scripts (the Storage lifecycle rule)
        run: npm run test:deploy

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/functions/package-lock.json
      - run: npm ci && npm --prefix functions ci
      - name: Cloud Functions integration tests (Auth, Firestore, Functions, Storage emulators)
        # Also reports which backend code the tests ran (c8, from the emulator's own processes).
        run: npm run test:integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/functions/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start the Firebase emulators
        working-directory: backend
        run: |
          npm ci && npm --prefix functions ci && npm --prefix functions run build
          nohup npx firebase emulators:start --only auth,firestore,functions,storage --project demo-meadow > emulators.log 2>&1 &
          region=$(sed -n 's/^MEADOW_REGION=//p' functions/.env)
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"data":{}}' \
              "http://127.0.0.1:5001/demo-meadow/$region/createProfile" || true)
            if [ "$code" != "000" ] && [ "$code" != "404" ]; then echo "Emulators ready ($code)"; exit 0; fi
            sleep 2
          done
          cat emulators.log
          exit 1
      - name: Build the test app
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pmeadow.emulatorHost=10.0.2.2 --stacktrace
      - name: End-to-end tests (Android emulator against Firebase emulators)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A phone's screen, not the default AVD's low density: text contrast is measured from
          # pixels, and at mdpi thin strokes are all anti-aliased edge (real phones are ~420dpi).
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pmeadow.emulatorHost=10.0.2.2 --stacktrace || (adb pull /data/local/tmp/meadow-contrast app/build/reports/androidTests/ || true; adb logcat -d -v time Meadow:V MeadowSync:V MeadowBackend:V MeadowFirestore:V MeadowSocial:V MeadowListener:V MeadowGuardian:V FirebaseAuth:V FirebaseFunctions:V Firestore:W System.err:W AndroidRuntime:E ActivityManager:E '*:S' | tail -n 200; exit 1)
      - name: Show end-to-end results
        if: failure()
        run: |
          tail -n 80 backend/emulators.log || true
          python3 .github/scripts/failed_tests.py app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-reports
          path: |
            app/build/reports/androidTests/
            backend/emulators.log
          if-no-files-found: ignore
