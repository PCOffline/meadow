name: Pictures

# Draws a pull request's pictures on an Android emulator and puts them in its description: each
# story step by step with a video, and every screen of the debug gallery in each look that
# changed, before and after. Read "Pull requests" in AGENTS.md. The pictures are published on the
# branch pictures/pr-<number>. A pull request from a fork gets them in the run's artifact only.
#
# Two jobs: "pictures" builds and runs the pull request's code with a read-only token, and
# "publish" holds the write token and runs no code from the pull request, only the base's.
#
# A push to main draws main's pictures and keeps them in the Actions cache, under a key for what
# they're drawn from (.github/scripts/pictures-key.sh). A pull request on main then takes its
# "before" pictures from the cache, and builds and draws only its own.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - '!app/src/test/**'
      - '!app/src/testDebug/**'
      - '!app/src/androidTest/**'
      - 'app/src/androidTest/**/pictures/**'
      - 'app/build.gradle.kts'
      - 'legal/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/scripts/pr_pictures.py'
      - '.github/scripts/draw-pictures.sh'
      - '.github/scripts/pictures-key.sh'
      - '.github/workflows/pictures.yml'
  pull_request:
    paths:
      - 'app/src/**'
      - '!app/src/test/**'
      - '!app/src/testDebug/**'
      # The end-to-end journeys draw nothing; the stories and the gallery's tests do.
      - '!app/src/androidTest/**'
      - 'app/src/androidTest/**/pictures/**'
      - 'app/build.gradle.kts'
      - 'legal/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/scripts/pr_pictures.py'
      - '.github/scripts/draw-pictures.sh'
      - '.github/scripts/pictures-key.sh'
      - '.github/workflows/pictures.yml'

# Each job asks for only what it needs.
permissions: {}

jobs:
  pictures:
    # A newer push to the same pull request makes an older drawing pointless.
    concurrency:
      group: pictures-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    outputs:
      folder: ${{ steps.prepare.outputs.folder }}
    env:
      NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the base
        id: base
        if: github.event_name == 'pull_request'
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "Base: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "key=$(.github/scripts/pictures-key.sh "$base")" >> "$GITHUB_OUTPUT"
      - name: Restore the base's pictures
        id: cached
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/pictures/before
          key: ${{ steps.base.outputs.key }}
      - name: Check out the base
        id: draw-base
        if: github.event_name == 'pull_request' && steps.cached.outputs.cache-hit != 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add ../base "$BASE"
          echo "yes=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install pillow
      - name: Build the app, and the base when its pictures aren't in the cache
        env:
          DRAW_BASE: ${{ steps.draw-base.outputs.yes }}
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          # The base may not build, or may have no pictures yet: then every picture is new.
          if [ "$DRAW_BASE" = true ]; then
            (cd ../base && ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace) || echo "The base didn't build"
          fi
      - name: Draw on an emulator
        env:
          DRAW_BASE: ${{ steps.draw-base.outputs.yes }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The tests turn the motion off for the gallery and on for the stories.
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20
            if [ "$DRAW_BASE" = true ]; then .github/scripts/draw-pictures.sh ../base build/pictures/before || echo "The base drew no pictures, or not all of them"; fi
            .github/scripts/draw-pictures.sh . build/pictures/after
      # On main, the pictures drawn are the "before" of the pull requests to come.
      - name: Keep main's pictures
        if: github.event_name == 'push'
        run: |
          echo "key=$(.github/scripts/pictures-key.sh HEAD)" >> "$GITHUB_ENV"
          mv build/pictures/after build/pictures/before
      - name: Save main's pictures
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/pictures/before
          key: ${{ env.key }}
      - name: Prepare the pictures
        id: prepare
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Each run has a folder of its own, so a picture never comes from an older run's cache.
          echo "folder=$RUN" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/pr_pictures.py build/pictures/before build/pictures/after build/pictures/site \
            "https://raw.githubusercontent.com/$REPO/refs/heads/pictures/pr-$NUMBER/$RUN" \
            "https://github.com/$REPO/tree/pictures/pr-$NUMBER/$RUN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: pictures-site
          path: build/pictures/site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pictures
          path: |
            build/pictures/
            app/build/reports/androidTests/
          if-no-files-found: ignore

  # Publishes what "pictures" drew. It runs no code from the pull request: its scripts come from
  # the base, and the pictures are only files to push and text for the description.
  publish:
    needs: pictures
    # A fork's pull request gets a token that can't publish.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pictures-publish-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the pictures on their own branch
      pull-requests: write # puts them in the pull request's description
    timeout-minutes: 10
    env:
      NUMBER: ${{ github.event.pull_request.number }}
      FOLDER: ${{ needs.pictures.outputs.folder }}
    steps:
      - name: Check the folder's name
        # It comes from the job that ran the pull request's code, so it is checked before use.
        run: |
          if ! [[ "$FOLDER" =~ ^[0-9]+-[0-9]+$ ]]; then echo "::error::Not a run's folder: $FOLDER"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base, not the pull request: its scripts are the ones this job runs.
          ref: ${{ github.event.pull_request.base.sha }}
          # The publish step pushes the pictures' branch with these credentials.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pictures-site
          path: ${{ runner.temp }}/site
      - name: Publish the pictures
        env:
          SITE: ${{ runner.temp }}/site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only this run's pictures: the branch has one commit, replaced on each run.
          git worktree add --orphan -b "pictures/pr-$NUMBER" ../publish
          mkdir -p "../publish/$FOLDER"
          cp -r "$SITE/." "../publish/$FOLDER/"
          cd ../publish
          git add .
          git commit -q -m "Pictures for pull request #$NUMBER"
          git push --force origin "HEAD:refs/heads/pictures/pr-$NUMBER"
      - name: Put them in the description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE: ${{ runner.temp }}/site
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          python3 .github/scripts/pr_pictures.py body "$RUNNER_TEMP/body.md" "$SITE/pictures.md" > "$RUNNER_TEMP/new-body.md"
          gh api -X PATCH "repos/$REPO/pulls/$NUMBER" -F body=@"$RUNNER_TEMP/new-body.md" > /dev/null
