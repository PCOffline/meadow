name: Screenshots

# Renders the README's screenshots and animations on an Android emulator and commits them.
# Runs for pushes whose commit message contains [screenshots].
on:
  # Branches only: a tag on a [screenshots] commit has no branch to commit the images to.
  push:
    branches: ['**']

# Each job asks for only what it needs.
permissions: {}

jobs:
  screenshots:
    if: contains(github.event.head_commit.message, '[screenshots]')
    # On the job, so pushes that don't ask for screenshots never cancel a run that does.
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the new images to the branch
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job commits the new images back to the branch.
          persist-credentials: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install pillow
      - name: Build the app and tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Capture on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Animations stay on: the recordings show them.
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.showcase=true -Pandroid.testInstrumentationRunnerArguments.class=dev.pcoffline.meadow.showcase.ShowcaseTest --stacktrace
            mkdir -p build/showcase
            adb pull /sdcard/Pictures/meadow build/showcase
      - name: Prepare images
        run: python3 .github/scripts/prepare_screenshots.py build/showcase/meadow docs/images
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git commit -m "Update README screenshots and animations"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: showcase-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
