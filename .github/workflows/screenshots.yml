name: Screenshots

# Renders the README's screenshots and animations on an Android emulator and commits them to the
# pull request, so they're current when it merges. Runs when a pull request changes anything the
# screens are drawn from, or by hand for any branch.
on:
  pull_request:
    paths:
      - 'app/src/**'
      - '!app/src/test/**'
      - '!app/src/testDebug/**'
      - '!app/src/androidTest/**'
      - 'app/src/androidTest/**/showcase/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/scripts/prepare_screenshots.py'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

# Each job asks for only what it needs.
permissions: {}

jobs:
  screenshots:
    # A fork's pull request can't be committed to from here, so it's left alone.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # A newer push to the same branch makes an older rendering pointless.
    concurrency:
      group: screenshots-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the new images to the branch
      actions: write # runs Build on that commit (see the last step)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch itself, not the merge preview: the new images are committed to it.
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install image tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install pillow
      - name: Build the app and tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Capture on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Animations stay on: the recordings show them.
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            sleep 20
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.showcase=true -Pandroid.testInstrumentationRunnerArguments.class=dev.pcoffline.meadow.showcase.ShowcaseTest --stacktrace
            mkdir -p build/showcase
            adb pull /sdcard/Pictures/meadow build/showcase
      - name: Prepare images
        run: python3 .github/scripts/prepare_screenshots.py build/showcase/meadow docs/images
      - name: Commit images
        id: commit
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then echo "Images unchanged"; exit 0; fi
          git commit -m "docs: update README screenshots and animations"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A commit pushed with this job's token starts no workflows, so the pull request's new head
      # would have no checks; Build is started on it by hand instead.
      - name: Build the new commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: showcase-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
